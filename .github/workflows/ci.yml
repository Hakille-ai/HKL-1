name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: "📝 Format Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup default nightly && rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: "🔍 Clippy Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup default nightly && rustup component add clippy
      - name: Clippy (host features)
        run: cargo clippy --features std,alloc,simd -- -D warnings

  test:
    name: "🧪 Test Suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup default nightly
      - name: Build
        run: cargo build --features std,alloc,simd
      - name: Unit tests
        run: cargo test --lib --features std,alloc,simd -- --test-threads=1
      - name: Integration tests
        run: cargo test --test integration --features std,alloc,simd -- --test-threads=1
      - name: All tests
        run: cargo test --features std,alloc,simd -- --test-threads=1

  cross-compile:
    name: "🔧 Cross-Compile ${{ matrix.target }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: thumbv7em-none-eabihf
            features: stm32f7,alloc
            label: "ARM Cortex-M7"
          - target: riscv32imac-unknown-none-elf
            features: hifive1,alloc
            label: "RISC-V RV32 (HiFive1)"
          - target: riscv32imc-unknown-none-elf
            features: esp32c6,alloc
            label: "RISC-V RV32 (ESP32-C6)"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup default nightly
          rustup target add ${{ matrix.target }}
      - name: "Build for ${{ matrix.label }}"
        run: cargo build --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

  deny:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check dependencies
        run: cargo deny check
